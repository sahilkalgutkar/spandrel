name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: gofmt
        run: make fmt-check

      - name: go vet
        run: make vet

      - name: build
        run: make build

      # The race detector is not optional. This process exists to fan spans
      # from many connections into shared per-trace state, so almost every
      # bug it can have is a data race, and a green run without -race says
      # very little about whether it works.
      - name: test
        run: go test -race -count=1 -timeout 5m ./...

      - name: coverage
        run: go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out -timeout 5m ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.out
          fail_ci_if_error: false
