# Coverage is a floor, not a target: the number is there to stop a change from
# quietly shipping untested, not to be optimised for its own sake.
coverage:
  status:
    project:
      default:
        target: 80%
        threshold: 2%
    patch:
      default:
        target: 80%
        threshold: 5%

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: true
